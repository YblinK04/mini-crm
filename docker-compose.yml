version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres-local
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_local_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data

volumes:
  postgres_crm_data:
